<title>Arixa Lens · Document Intelligence (Demo)</title>

<style>
:root{--bg:#0a1c19;--side:#07151a;--sage:#a9c19a;--mint:#86d4b4;--teal:#4fb0a4;--lagoon:#6bb4c4;--olive:#c8cc8c;--moss:#86a566;--sand:#dcd3a8;--surface:#0f2623;--surface2:#143230;--panel:#0f2623;--panel2:#143230;--line:#1e3f3b;--line2:#2e524d;--text:#e6eee6;--muted:#8fa59b;--accent:#a9c19a;--orange:#a9c19a;--orange2:#a9c19a;--green:#6fcf9a;--red:#d9695f;--amber:#dcb35c;--blue:#8fa59b;--purple:#8fa59b;--bank:#7fc8a0;--other:#8fa59b;--text-strong:#f1f6ee;--on-accent:#0a1c19;color-scheme:dark;--r:6px;--r2:3px;--serif:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600}
h1{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
h2{font-size:15px}h3{font-size:14px}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.muted{color:var(--muted)}.small{font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#0a1c19;padding:8px 12px;border-radius:var(--r2);z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:32px;z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{width:30px;height:30px;border-radius:var(--r2);background:var(--accent);display:grid;place-items:center}
.logo svg{width:20px;height:20px;stroke:#0a1c19;fill:none;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.1}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
#nav{display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r2);color:var(--muted);font-weight:500}
#nav a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#nav a:hover{color:var(--text);background:var(--surface)}
#nav a.active{color:var(--text);background:var(--surface2);box-shadow:inset 2px 0 0 var(--accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0;display:grid;gap:10px;font-size:12.5px;color:var(--muted);line-height:1.55}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:var(--r2);border:1px solid var(--line2);color:var(--muted);white-space:nowrap;width:max-content}
.pill.demo::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:16px 48px;background:var(--bg);border-bottom:1px solid var(--line)}
#gsearch{flex:1;max-width:520px}
.menu{display:none}
input[type=search],input[type=text],select,.field-in{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r2);padding:10px 12px;min-height:42px}
input::placeholder{color:#5f7a72}
input:focus,select:focus{border-color:var(--accent);outline:none}
select{appearance:auto;color-scheme:dark}
#view{padding:48px;max-width:1240px;width:100%;margin:0 auto;outline:none}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:36px}
.pagehead p{margin-top:8px;max-width:60ch}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border-radius:var(--r2);border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:500;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{border-color:var(--muted);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0a1c19;font-weight:600}
.btn.primary:hover{background:#c0d4b3;border-color:#c0d4b3}
.btn.danger{color:var(--red);border-color:#5a3d3a}
.btn.danger:hover{background:rgba(217,105,95,.1);border-color:var(--red)}
.btn.sm{min-height:32px;padding:4px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:var(--r2);border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.card+.card{margin-top:24px}
.card h2{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:32px}
.stat{background:var(--surface);padding:26px 28px}
.stat .lbl{color:var(--muted);font-size:13px}
.stat .num{font-family:var(--serif);font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:24px;align-items:start}
.grid2 .card+.card{margin-top:0}
.grid-res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start}
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.09em;white-space:nowrap;padding-top:0}
tbody tr:hover td,tbody tr:hover th{background:rgba(255,255,255,.015)}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:none}
tbody th{font-weight:500}
.fname{font-weight:500;word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:2px 9px;border:1px solid var(--line2);border-radius:var(--r2);color:var(--text);white-space:nowrap;background:none}
.badge[class*=" s-"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
.s-ok::before{background:var(--green)!important}
.s-ver::before{background:var(--green)!important;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--green)}
.s-warn::before{background:var(--amber)!important}
.s-err::before{background:var(--red)!important}
.s-p::before{background:var(--accent)!important}
.bar{height:4px;border-radius:2px;background:var(--line2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar.hi i{background:#c7d6bb}.bar.mid i{background:var(--amber)}.bar.lo i{background:var(--red)}
.cc{display:flex;align-items:center;gap:10px;min-width:120px}.cc span{font-size:13px;width:40px;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.dist{display:grid;gap:4px}
.drow{display:grid;grid-template-columns:92px 1fr 28px;gap:16px;align-items:center;padding:9px 0;font-size:14px}
.drow em{font-style:normal;color:var(--muted);text-align:right;font-family:var(--mono);font-size:13px}
.drow .bar i{background:#c7d6bb}
.drop{border:1px dashed var(--line2);border-radius:var(--r);padding:64px 24px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s;margin-bottom:24px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--surface2)}
.drop svg{width:34px;height:34px;stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:14px}
.drop h2{justify-content:center;margin-bottom:8px;font-family:var(--serif);font-size:22px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text)}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.qitem{display:flex;gap:18px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--bg)}
.qmain{flex:1;min-width:0;display:grid;gap:8px}
.qact{display:flex;gap:8px;align-items:center}
.samples{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.sample{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:18px;cursor:pointer;transition:border-color .12s}
.sample:hover{border-color:var(--accent)}
.sample small{color:var(--muted)}
.steps{display:flex;gap:10px;flex-wrap:wrap;counter-reset:s}
.steps span{counter-increment:s;font-size:13px;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:var(--r2)}
.steps span::before{content:counter(s,decimal-leading-zero);margin-right:8px;font-family:var(--mono);font-size:11px;color:var(--accent)}
.banner{border-left:2px solid var(--accent);background:var(--surface);padding:14px 18px;font-size:14px;margin-bottom:32px;color:var(--text);border-radius:0 var(--r2) var(--r2) 0}
.banner.note{border-left-color:var(--line2);color:var(--muted)}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted);cursor:pointer;font-weight:500;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.pane{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);padding:20px}
.pane pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.7 var(--mono);color:#cfdccf}
.pgh{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:18px 0 8px}.pgh:first-child{margin-top:0}
.pane img{max-width:100%;border-radius:var(--r2);display:block;margin:auto}
mark{background:rgba(169,193,154,.28);color:inherit;border-radius:2px;padding:0 2px}
.sticky{position:sticky;top:96px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:12px 24px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.field-in{min-height:36px;padding:6px 10px;font-size:14px;min-width:160px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted)}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.src{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:2px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}
.warnlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.warnlist li{display:flex;gap:12px;font-size:14px;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--bg)}
.warnlist li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:9px;background:var(--amber)}
.warnlist li.error::before{background:var(--red)}.warnlist li.info::before{background:var(--muted)}
.okline{color:var(--green);font-size:14px}
.searchbar{display:grid;grid-template-columns:1fr 200px;gap:12px}
.res{display:block;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;background:var(--surface);margin-top:16px;cursor:pointer;transition:border-color .12s}
.res:hover{border-color:var(--accent)}
.res .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.res p{color:var(--muted);font-size:13.5px}
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty h2{justify-content:center;color:var(--text);margin-bottom:8px;font-family:var(--serif);font-size:22px;font-weight:500;text-transform:none;letter-spacing:0}
.switch{display:flex;gap:14px;align-items:flex-start}.switch input{width:18px;height:18px;accent-color:var(--accent);margin-top:3px}
.spin{width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:200;max-width:calc(100vw - 40px)}
.toast{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line2);border-left:2px solid var(--muted);border-radius:var(--r2);padding:12px 16px;min-width:260px;max-width:420px;animation:in .2s;font-size:14px}
.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}
.toast button{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.scrim{display:none}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.grid-res{grid-template-columns:1fr}.sticky{position:static}.samples{grid-template-columns:repeat(2,1fr)}#view{padding:36px 32px}.topbar{padding:14px 32px}}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .sidebar{position:fixed;left:0;top:0;width:264px;transform:translateX(-100%);transition:transform .2s}
 body.nav-open .sidebar{transform:none}
 body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:35}
 .menu{display:inline-grid;place-items:center}
 .topbar{padding:12px 16px}#view{padding:28px 16px}
 .topbar .pill{display:none}
}
@media (max-width:560px){.stat{padding:18px}.stat .num{font-size:30px}.samples{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr}h1{font-size:26px}.topbar .btn.primary{display:none}.qitem{flex-wrap:wrap}.card{padding:20px}.drop{padding:40px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---- multi-tone sage palette ---- */
body{background:radial-gradient(1100px 520px at 85% -120px,rgba(79,176,164,.10),transparent 70%),radial-gradient(900px 480px at 10% 110%,rgba(169,193,154,.06),transparent 70%),var(--bg);background-attachment:fixed}
.logo{background:linear-gradient(135deg,var(--sage),var(--mint))}
#nav a[data-route=dashboard] svg{color:var(--sage)}
#nav a[data-route=upload] svg{color:var(--mint)}
#nav a[data-route=results] svg{color:var(--teal)}
#nav a[data-route=search] svg{color:var(--lagoon)}
#nav a[data-route=history] svg{color:var(--olive)}
#nav a[data-route=settings] svg{color:var(--sand)}
#nav a.active{box-shadow:inset 2px 0 0 var(--sage)}
#nav a.active svg{filter:brightness(1.15)}
h1{color:#f1f6ee}
.btn.primary{background:linear-gradient(135deg,var(--sage),var(--mint));border-color:transparent}
.btn.primary:hover{background:linear-gradient(135deg,#bcd2ad,#9be0c4);border-color:transparent}
.btn:hover{border-color:var(--teal)}
.card{border-top:2px solid var(--line)}
.card h2{color:#a7bdb2}
.stat{position:relative}
.stat::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--c,var(--sage))}
.stat:nth-child(1){--c:var(--sage)}.stat:nth-child(2){--c:var(--mint)}.stat:nth-child(3){--c:var(--olive)}.stat:nth-child(4){--c:var(--lagoon)}
.stat .num{color:var(--c)}
.badge[class*=" t-"]::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--tc,var(--muted));flex:none}
.t-Invoice{--tc:var(--sage)}.t-Certificate{--tc:var(--teal)}.t-Form{--tc:var(--mint)}.t-Report{--tc:var(--olive)}.t-Other{--tc:var(--other)}
.drow:nth-child(1) .bar i{background:var(--sage)}.drow:nth-child(2) .bar i{background:var(--teal)}.drow:nth-child(3) .bar i{background:var(--mint)}.drow:nth-child(4) .bar i{background:var(--olive)}.drow:nth-child(5) .bar i{background:var(--other)}
.bar i{background:linear-gradient(90deg,var(--teal),var(--mint))}
.bar.hi i{background:linear-gradient(90deg,var(--teal),var(--mint))}.bar.mid i{background:var(--amber)}.bar.lo i{background:var(--red)}
.s-p::before{background:var(--lagoon)!important}
.banner{border-left-color:var(--teal);background:linear-gradient(90deg,rgba(79,176,164,.10),transparent 70%),var(--surface)}
.tab[aria-selected=true]{border-bottom-color:var(--mint);color:#f1f6ee}
.sample:hover,.res:hover,.drop:hover,.drop.over{border-color:var(--teal)}
.sample:nth-child(1) .badge{--tc:var(--sage)}
.steps span:nth-child(7n+1)::before{color:var(--sage)}.steps span:nth-child(7n+2)::before{color:var(--mint)}.steps span:nth-child(7n+3)::before{color:var(--teal)}.steps span:nth-child(7n+4)::before{color:var(--lagoon)}.steps span:nth-child(7n+5)::before{color:var(--olive)}.steps span:nth-child(7n+6)::before{color:var(--sand)}.steps span:nth-child(7n+7)::before{color:var(--moss)}
.src{color:var(--mint)}
mark{background:rgba(134,212,180,.28)}
.kv dt{color:#8fb0a3}
.pgh{color:var(--teal)}
.drop svg{stroke:var(--mint)}
#introSvg .acc{stroke:var(--ac,var(--accent))}#introSvg .fill{fill:var(--ac,var(--accent))}
.intro-title{background:linear-gradient(90deg,var(--sage),var(--mint),var(--lagoon));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro-word{color:#f1f6ee}
#toasts .toast.info{border-left-color:var(--lagoon)}

/* ---- colour pass 2 ---- */
::selection{background:rgba(134,212,180,.32);color:#fff}
*{scrollbar-width:thin;scrollbar-color:#2f5a54 transparent}
.card{--cc:var(--sage);border-top:2px solid var(--cc)}
section.card:nth-of-type(4n+2){--cc:var(--mint)}
section.card:nth-of-type(4n+3){--cc:var(--teal)}
section.card:nth-of-type(4n+4){--cc:var(--lagoon)}
.card h2{color:var(--cc)}
.card h2 .btn{color:var(--text)}
.card.empty{--cc:var(--teal)}.card.empty h2{color:var(--text)}
thead th{color:var(--cc,var(--muted));border-bottom-color:var(--line2)}
tbody tr:hover td,tbody tr:hover th{background:rgba(134,212,180,.05)}
tbody th{color:#dbe8df}
.fname{color:#eef5ec}
.field-in:focus,input[type=search]:focus,select:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(134,212,180,.15)}
.check input,.switch input{accent-color:var(--mint)}
.kv dt{color:var(--teal)}
.warnlist li{border-left:3px solid var(--amber);background:linear-gradient(90deg,rgba(220,179,92,.08),transparent 60%),var(--bg)}
.warnlist li.error{border-left-color:var(--red);background:linear-gradient(90deg,rgba(217,105,95,.10),transparent 60%),var(--bg)}
.warnlist li.info{border-left-color:var(--lagoon);background:linear-gradient(90deg,rgba(107,180,196,.08),transparent 60%),var(--bg)}
.okline{color:var(--mint);padding:12px 14px;border-left:3px solid var(--mint);background:linear-gradient(90deg,rgba(134,212,180,.10),transparent 60%),var(--bg);border-radius:var(--r2)}
.qitem{border-left:3px solid var(--lagoon)}
.qitem:has(.s-ok){border-left-color:var(--green)}.qitem:has(.s-err){border-left-color:var(--red)}
.sample{border-top:2px solid var(--tc,var(--sage))}
.sample:nth-child(1){--tc:var(--sage)}.sample:nth-child(2){--tc:var(--teal)}.sample:nth-child(3){--tc:var(--mint)}.sample:nth-child(4){--tc:var(--olive)}
.sample:hover{border-color:var(--tc)}
.sample b{color:#eef5ec}
.res{border-left:3px solid var(--teal)}
.res:nth-of-type(3n+2){border-left-color:var(--mint)}.res:nth-of-type(3n+3){border-left-color:var(--olive)}
.res:hover{background:var(--surface2)}
.steps span{border-color:var(--line2);background:rgba(134,212,180,.04)}
.drop{background:linear-gradient(180deg,rgba(79,176,164,.07),transparent),var(--surface);border-color:var(--teal)}
.drop h2{color:#f1f6ee}
.btn.danger{color:#e79088}
.pill{border-color:var(--teal);color:#a7d5c9}
.pill.demo::before{background:var(--mint)}
.side-foot{border-top-color:var(--line2)}
.brand b{color:#f1f6ee}.brand span{color:var(--teal)}
.topbar{background:linear-gradient(180deg,#0b201d,var(--bg))}
.badge{background:rgba(255,255,255,.02)}
.stat .lbl{color:#a7bdb2}
.pane{border-color:var(--line2)}
.tab{color:#8fb0a3}.tab:hover{color:var(--mint)}
.toast.success{border-left-color:var(--mint)}
.icon-btn:hover{border-color:var(--teal);color:var(--mint)}
.empty h2{color:#f1f6ee}
.fname{word-break:normal;overflow-wrap:anywhere}
td.fname{min-width:150px}

.app{position:relative;z-index:1}
.sidebar{background:rgba(7,21,26,.66);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar{background:rgba(10,28,25,.58);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card{background:rgba(15,38,35,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.stats{background:rgba(46,82,77,.55)}
.stat{background:rgba(15,38,35,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.banner{background:linear-gradient(90deg,rgba(79,176,164,.14),transparent 70%),rgba(15,38,35,.6)}
.pane,.qitem,.sample,.warnlist li,.okline{background-color:rgba(6,20,18,.45)}
input[type=search],input[type=text],select,.field-in{background:rgba(15,38,35,.7)}
.res{background:rgba(15,38,35,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.drop{background:linear-gradient(180deg,rgba(79,176,164,.08),transparent),rgba(15,38,35,.5)}
@media (max-width:900px){.sidebar{background:rgba(7,21,26,.94)}}

/* ---- features, animations, highlight effect ---- */
.t-Receipt{--tc:var(--moss)}.t-Resume{--tc:var(--sand)}.t-IDCard{--tc:var(--lagoon)}.t-BankStatement{--tc:var(--bank)}
.sample:nth-child(5){--tc:var(--moss)}.sample:nth-child(6){--tc:var(--sand)}.sample:nth-child(7){--tc:var(--lagoon)}.sample:nth-child(8){--tc:var(--bank)}
.c0{--mc:rgba(169,193,154,.34);--mb:#a9c19a}.c1{--mc:rgba(134,212,180,.30);--mb:#86d4b4}.c2{--mc:rgba(79,176,164,.36);--mb:#4fb0a4}
.c3{--mc:rgba(107,180,196,.32);--mb:#6bb4c4}.c4{--mc:rgba(200,204,140,.32);--mb:#c8cc8c}.c5{--mc:rgba(220,211,168,.30);--mb:#dcd3a8}
mark{background:linear-gradient(rgba(134,212,180,.32),rgba(134,212,180,.32)) no-repeat 0 0/100% 100%;color:inherit;border-radius:3px;padding:1px 3px;animation:sweep .7s cubic-bezier(.2,.7,.2,1) both}
mark.m{background:linear-gradient(var(--mc),var(--mc)) no-repeat 0 0/100% 100%;box-shadow:inset 0 -2px 0 var(--mb)}
mark.m.sel{outline:2px solid rgba(255,255,255,.55);outline-offset:1px;animation:sweep .5s both,glow 1.4s .5s 2}
@keyframes sweep{from{background-size:0% 100%}to{background-size:100% 100%}}
@keyframes glow{50%{box-shadow:inset 0 -2px 0 var(--mb),0 0 0 5px rgba(134,212,180,.3)}}
.hl-fx{background:linear-gradient(transparent 62%,rgba(134,212,180,.30) 62%) no-repeat 0 0/100% 100%;padding:0 6px;margin:0 -6px}
#view.enter .hl-fx{animation:sweep 1s .3s cubic-bezier(.2,.7,.2,1) both}
.hlbar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--mb);background:var(--mc);color:var(--text);border-radius:999px;padding:2px 11px;font-size:12px;cursor:pointer;transition:transform .12s,background .12s}
.chip:hover{transform:translateY(-1px)}.chip.on{background:var(--mb);color:#0a1c19;font-weight:600}
.pipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.pipe span{padding:2px 9px;border:1px solid var(--line2);border-radius:999px;transition:all .25s}
.pipe i{width:10px;height:1px;background:var(--line2)}
.pipe .on{color:#0a1c19;background:var(--mint);border-color:var(--mint)}
.pipe .now{color:var(--mint);border-color:var(--mint);animation:pulse2 1s infinite}
.pipe .err{color:var(--red);border-color:var(--red)}
.hist{list-style:none;margin:0;padding:0;border-left:2px solid var(--line2);margin-left:5px}
.hist li{padding:8px 0 8px 18px;position:relative;font-size:13.5px;display:grid;gap:2px}
.hist li::before{content:"";position:absolute;left:-7px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(79,176,164,.2)}
.hist time{font-size:12px;color:var(--muted)}
.bstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bstat{border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;background:rgba(6,20,18,.4)}
.bstat span{font-size:12.5px;color:var(--muted)}.bstat b{display:block;font:500 26px var(--serif);color:var(--mint);margin-top:2px}

const KWRE={};Object.keys(KW).forEach(t=>{KWRE[t]=KW[t].map(([k,w])=>{const src=k.replace(/ /g,'\\s+');return [/[^\x00-\x7F]/.test(k)?new RegExp(src,'i'):new RegExp('\\b'+src+'\\b','i'),w]})});
function classify(text){
  const sc=Object.keys(KWRE).map(t=>[t,KWRE[t].reduce((a,[re,w])=>a+(re.test(text)?w:0),0)]).sort((a,b)=>b[1]-a[1]);
  const top=sc[0][1],second=sc[1][1];
  if(top<3) return {type:'Other',conf:0.4};
  return {type:sc[0][0],conf:+Math.min(0.97,0.5+0.47*((top-second)/top)).toFixed(2)};
}

function grab(pages,pats){
  for(const p of pats){
    const re=p[0],conf=p[1];
    for(let i=0;i<pages.length;i++){
      const m=re.exec(pages[i]);
      if(m){const v=clean(m[1]);if(v) return {value:v,conf,page:i+1,snippet:clean(m[0]).slice(0,100),hs:m.index,hl:m[0].length};}
    }
  }
  return null;
}
function extractFields(type,pages,factor){
  return (FIELD_DEFS[type]||FIELD_DEFS.Other).map(def=>{
    let r=grab(pages,def.pats||[]);
    if(!r&&def.fb) r=def.fb(pages);
    return {key:def.key,required:!!def.req,miss:def.miss||'',value:r?r.value:'',conf:r?+Math.min(0.99,r.conf*factor).toFixed(2):0,page:r?r.page:null,snippet:r?r.snippet:'',hs:r?r.hs:null,hl:r?r.hl:null,verified:false,edited:false};
  });
}

/* ---------- validation ---------- */
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function mk(y,m,d){if(m<1||m>12||d<1||d>31)return null;const x=new Date(y,m-1,d);return x.getMonth()===m-1?x:null}
function parseDate(s){
  s=String(s).trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return mk(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){let y=+m[3],a=+m[1],b=+m[2];if(y<100)y+=2000;if(b>12&&a<=12){const t=a;a=b;b=t}return mk(y,b,a)}
  if((m=s.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})$/))){const mi=MON.indexOf(m[2].slice(0,3).toLowerCase())+1;return mi?mk(+m[3],mi,+m[1]):null}
  if((m=s.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})$/))){const mi=MON.indexOf(m[1].slice(0,3).toLowerCase())+1;return mi?mk(+m[3],mi,+m[2]):null}
  return null;
}
function validate(type,fields,pages){
  const w=[];
  const val=k=>{const f=fields.find(x=>x.key===k);return f?f.value:''};
  if(pages.length&&!pages.join('').trim()) w.push({level:'error',msg:'No text could be extracted. Try a clearer or higher-resolution scan.'});
  const opt=[];
  fields.forEach(f=>{
    if(!f.value){ if(f.required) w.push({level:'warn',msg:f.miss||`${f.key} is missing (required for ${type.toLowerCase()} documents).`,field:f.key}); else opt.push(f.key); }
    else if(f.conf<0.6&&!f.edited) w.push({level:'info',msg:`Low confidence on ${f.key} (${pct(f.conf)}) — please verify.`,field:f.key});
  });
  if(opt.length) w.push({level:'info',msg:'Optional fields not found: '+opt.join(', ')+'.'});
  const num=k=>{const v=val(k);return v?toNum(v):NaN};
  const dte=k=>{const v=val(k);return v?parseDate(v):null};
  const today=new Date();
  if(type==='Invoice'||type==='Receipt'){
    const s=num('Subtotal'),t=num('Tax'),g=num('Total');
    if(!isNaN(s)&&!isNaN(t)&&!isNaN(g)&&Math.abs(s+t-g)>0.01) w.push({level:'warn',msg:`Inconsistent amounts: Subtotal ${fmtN(s)} + Tax ${fmtN(t)} = ${fmtN(s+t)}, but Total is ${fmtN(g)}.`,field:'Total'});
    const a=dte('Invoice Date'),b=dte('Due Date');
    if(a&&b&&b<a) w.push({level:'warn',msg:`Due date (${val('Due Date')}) is earlier than the invoice date (${val('Invoice Date')}).`,field:'Due Date'});
    ['Invoice Date','Due Date'].forEach(k=>{if(val(k)&&!dte(k)) w.push({level:'info',msg:`Could not interpret ${k} "${val(k)}" as a valid date.`,field:k})});
  }
  if(type==='Receipt'){const a=dte('Date');if(a&&a>today)w.push({level:'warn',msg:`Receipt date (${val('Date')}) is in the future.`,field:'Date'})}
  if(type==='Bank Statement'){
    const o=num('Opening Balance'),c=num('Total Credits'),dd=num('Total Debits'),cl=num('Closing Balance');
    if(![o,c,dd,cl].some(isNaN)&&Math.abs(o+c-dd-cl)>0.01) w.push({level:'warn',msg:`Balances do not reconcile: ${fmtN(o)} + ${fmtN(c)} - ${fmtN(dd)} = ${fmtN(o+c-dd)}, but closing balance is ${fmtN(cl)}.`,field:'Closing Balance'});
  }
  if(type==='ID Card'){
    const v=dte('Valid Till'),i=dte('Issue Date');
    if(v&&i&&v<i) w.push({level:'warn',msg:`Valid-till date (${val('Valid Till')}) is earlier than the issue date (${val('Issue Date')}).`,field:'Valid Till'});
    else if(v&&v<today) w.push({level:'warn',msg:`This ID card expired on ${val('Valid Till')}.`,field:'Valid Till'});
    ['Issue Date','Valid Till'].forEach(k=>{if(val(k)&&!dte(k)) w.push({level:'info',msg:`Could not interpret ${k} "${val(k)}" as a valid date.`,field:k})});
  }
  if(type==='Certificate'){
    const a=dte('Issue Date');
    if(a&&a>today) w.push({level:'warn',msg:`Issue date (${val('Issue Date')}) is in the future.`,field:'Issue Date'});
    if(val('Issue Date')&&!a) w.push({level:'info',msg:`Could not interpret Issue Date "${val('Issue Date')}" as a valid date.`,field:'Issue Date'});
  }
  if(type==='Form'||type==='ID Card'){
    const b=dte('Date of Birth');
    if(b&&b>today) w.push({level:'warn',msg:'Date of birth is in the future.',field:'Date of Birth'});
    else if(b&&today.getFullYear()-b.getFullYear()>110) w.push({level:'warn',msg:'Date of birth implies an age over 110 — please check.',field:'Date of Birth'});
    if(val('Date of Birth')&&!b) w.push({level:'info',msg:`Could not interpret Date of Birth "${val('Date of Birth')}" as a valid date.`,field:'Date of Birth'});
  }
  const em=val('Email');
  if(em&&!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(em)) w.push({level:'warn',msg:`Email "${em}" does not look like a valid address.`,field:'Email'});
  const ph=val('Phone');
  if(ph){const n=ph.replace(/\D/g,'').length;if(n<10||n>13) w.push({level:'warn',msg:`Phone number "${ph}" has an unusual number of digits (${n}).`,field:'Phone'});}
  return w;
}

/* ---------- summary ---------- */
function summarize(type,fields,pages,warnings){
  const v=k=>{const f=fields.find(x=>x.key===k);return f&&f.value?f.value:''};
  const cur=v('Currency');
  const money=x=>x?(cur?cur+(cur.length>1?' ':'')+x:x):'not found';
  const text=pages.join('\n');
  const words=(text.match(/\S+/g)||[]).length;
  const body=()=>{
    const lines=text.split('\n').map(clean).filter(l=>l.length>=40&&/[.!?]$/.test(l));
    return (lines.join(' ').match(/[^.!?]+[.!?]+/g)||[]).slice(0,2).map(clean).join(' ');
  };
  let s='';
  if(type==='Invoice') s=`Invoice ${v('Invoice Number')||'(number not found)'} issued by ${v('Vendor')||'an unidentified vendor'}${v('Bill To')?' to '+v('Bill To'):''}${v('Invoice Date')?', dated '+v('Invoice Date'):''}. Total amount: ${money(v('Total'))}${v('Due Date')?', payment due '+v('Due Date'):''}.`;
  else if(type==='Certificate') s=`Certificate awarded to ${v('Recipient')||'an unidentified recipient'} for "${v('Course / Title')||'an unspecified course'}"${v('Issuer')?', issued by '+v('Issuer'):''}${v('Issue Date')?' on '+v('Issue Date'):''}.${v('Certificate ID')?' Certificate ID '+v('Certificate ID')+'.':' No certificate ID was found.'}`;
  else if(type==='Form') s=`Form${v('Application / ID Number')?' '+v('Application / ID Number'):''} submitted by ${v('Full Name')||'an unnamed applicant'}${v('Date of Birth')?' (born '+v('Date of Birth')+')':''}. Contact: ${[v('Email'),v('Phone')].filter(Boolean).join(', ')||'not found'}.`;
  else if(type==='Report') s=`"${v('Title')||'Untitled report'}"${v('Author')?' — prepared by '+v('Author'):''}${v('Report Date')?', published '+v('Report Date'):''}. ${body()}`;
  else if(type==='Receipt') s=`Receipt ${v('Receipt Number')||'(number not found)'} from ${v('Merchant')||'an unidentified merchant'}${v('Date')?', dated '+v('Date'):''}. Total paid: ${money(v('Total'))}${v('Payment Method')?' via '+v('Payment Method'):''}.`;
  else if(type==='Resume') s=`Resume of ${v('Name')||'an unnamed candidate'}${[v('Email'),v('Phone')].filter(Boolean).length?' ('+[v('Email'),v('Phone')].filter(Boolean).join(', ')+')':''}.${v('Education')?' Education: '+v('Education')+'.':''}${v('Skills')?' Skills: '+v('Skills')+'.':''}`;
  else if(type==='ID Card') s=`ID card ${v('ID Number')||'(number not found)'} issued to ${v('Name')||'an unnamed holder'}${v('Date of Birth')?' (born '+v('Date of Birth')+')':''}${v('Valid Till')?', valid till '+v('Valid Till'):''}.`;
  else if(type==='Bank Statement') s=`Bank statement for ${v('Account Holder')||'an unidentified holder'}, account ${v('Account Number')||'(not found)'}${v('Bank')?' at '+v('Bank'):''}${v('Statement Period')?', period '+v('Statement Period'):''}. Opening balance ${money(v('Opening Balance'))}, closing balance ${money(v('Closing Balance'))}.`;
  else s=body()||(words?'Short document with no clear sentences to summarise.':'No readable text was extracted.');
  const issues=warnings.filter(x=>x.level==='warn'||x.level==='error').length;
  if(issues) s+=` ${issues} issue${issues>1?'s were':' was'} flagged for review.`;
  s+=` Length: ${pages.length} page${pages.length===1?'':'s'}, about ${words} words.`;
  return s.replace(/\s+/g,' ').trim();
}

/* ---------- pipeline ---------- */
function analyze(pages,factor,forceType){
  const text=pages.join('\n');
  const cls=forceType?{type:forceType,conf:1}:classify(text);
  const fields=extractFields(cls.type,pages,factor||1);
  const warnings=validate(cls.type,fields,pages);
  return {type:cls.type,typeConfidence:cls.conf,fields,warnings,summary:summarize(cls.type,fields,pages,warnings)};
}
function recalc(d){
  if(d.status==='Failed')return;
  const fs=d.fields,found=fs.filter(f=>f.value);
  const meanFound=found.length?found.reduce((a,f)=>a+f.conf,0)/found.length:0;
  const cov=fs.length?found.length/fs.length:0;
  d.confidence=+(0.6*meanFound+0.2*cov+0.2*(d.typeConfidence||0)).toFixed(3);
  const blocking=d.warnings.some(w=>w.level==='warn'||w.level==='error');
  if(found.length&&found.every(f=>f.verified)) d.status='Verified';
  else d.status=(!blocking&&d.confidence>=0.75)?'Processed':'Needs review';
}
function logEdit(d,msg){(d.history=d.history||[]).push({t:new Date().toISOString(),msg})}
const DUPKEY={Invoice:['Invoice Number'],Receipt:['Receipt Number','Merchant'],Certificate:['Certificate ID'],'ID Card':['ID Number'],Form:['Application / ID Number'],'Bank Statement':['Account Number','Statement Period'],Resume:['Email'],Report:['Title','Report Date']};
function keyOf(d){
  const ks=DUPKEY[d.type];if(!ks||!d.fields||!d.fields.length)return '';
  const vals=ks.map(k=>{const f=d.fields.find(x=>x.key===k);return f&&f.value?f.value.toLowerCase().replace(/\s+/g,' ').trim():''});
  return vals.every(Boolean)?vals.join('|'):'';
}
function findDup(d){const k=keyOf(d);if(!k)return null;return docs.find(x=>x.id!==d.id&&x.type===d.type&&x.status!=='Failed'&&keyOf(x)===k)||null}
function applyDup(d){
  d.warnings=(d.warnings||[]).filter(w=>!w.dup);
  const o=findDup(d);d.dupOf=o?o.id:null;
  if(o) d.warnings.push({level:'warn',dup:true,msg:`Possible duplicate: same ${(DUPKEY[d.type]||[]).join(' + ').toLowerCase()} as "${o.filename}" (uploaded ${fmtDate(o.uploaded)}).`});
}
function buildDoc(o){
  const a=analyze(o.pages,o.factor||1,null);
  const d=Object.assign({id:uid(),filename:o.filename,size:o.size,uploaded:o.uploaded||new Date().toISOString(),demo:!!o.demo,method:o.method,factor:o.factor||1,pages:o.pages,pageCount:o.pages.length,status:'Processed',confidence:0},a);
  recalc(d);d.history=[{t:d.uploaded,msg:`Processed as ${d.type} using ${d.method}; confidence ${pct(d.confidence)}`}];return d;
}
function failedDoc(it,err){
  return {id:uid(),filename:it.name,size:it.size,uploaded:new Date().toISOString(),demo:false,method:'—',factor:1,pages:[],pageCount:0,type:'Other',typeConfidence:0,confidence:0,status:'Failed',fields:[],warnings:[{level:'error',msg:'Extraction failed: '+err.message}],summary:''};
}

let docs=[],settings={persistValues:false,ocrLang:'eng'},hlAll=true,enterT=0;
const runtime={};          // id -> {preview, kind}
let queue=[],busy=false,curRoute='dashboard',lastViewed=null,selField=null,selDocId=null,resTab='text';

/* ---------- toasts ---------- */
function toast(msg,type){
  type=type||'info';
  const t=document.createElement('div');
  t.className='toast '+type;t.setAttribute('role',type==='error'?'alert':'status');
  t.innerHTML=`<span>${esc(msg)}</span><button type="button" aria-label="Dismiss notification">&times;</button>`;
  t.querySelector('button').onclick=()=>t.remove();
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),4500);
}

/* ---------- script loader & real extraction ---------- */
const loaded={};
function loadScript(src){
  return loaded[src]||(loaded[src]=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=src;s.onload=res;
    s.onerror=()=>{delete loaded[src];rej(new Error('Could not load a required library (are you offline?)'))};
    document.head.appendChild(s);
  }));
}
function setStep(it,step,p){it.step=step;it.progress=p;renderQueue()}
function itemsToText(items){let s='';items.forEach(i=>{s+=i.str+(i.hasEOL?'\n':' ')});return s.replace(/[ \t]+\n/g,'\n').trim()}
async function pageToCanvas(pg,scale){
  const vp=pg.getViewport({scale});const c=document.createElement('canvas');
  c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c;
}
async function ocrRun(it,sources,base,span){
  await loadScript(TESS_URL);
  if(!window.Tesseract) throw new Error('OCR engine unavailable');
  let cur=0;
  const worker=await window.Tesseract.createWorker(settings.ocrLang||'eng',1,{logger:m=>{if(m.status==='recognizing text'){it.progress=Math.round(base+((cur+m.progress)/sources.length)*span);renderQueue()}}});
  const texts=[],confs=[];
  try{
    for(cur=0;cur<sources.length;cur++){
      const src=typeof sources[cur]==='function'?await sources[cur]():sources[cur];
      const r=await worker.recognize(src);
      texts.push((r.data.text||'').trim());confs.push(r.data.confidence||0);
    }
  } finally { try{await worker.terminate()}catch(e){} }
  const avg=confs.reduce((a,b)=>a+b,0)/Math.max(1,confs.length);
  return {texts,factor:Math.max(0.5,Math.min(1,avg/100))};
}
async function extractReal(it){
  const ext=fileExt(it.name);
  if(ext==='pdf'){
    setStep(it,'Loading PDF engine',8);
    await loadScript(PDFJS_URL);
    const lib=window.pdfjsLib;if(!lib) throw new Error('PDF engine unavailable');
    lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    const pdf=await lib.getDocument({data:await it.file.arrayBuffer()}).promise;
    const n=Math.min(pdf.numPages,MAX_PAGES),pages=[];
    for(let i=1;i<=n;i++){
      setStep(it,`Extracting text — page ${i} of ${n}`,10+Math.round(i/n*35));
      const pg=await pdf.getPage(i);
      pages.push(itemsToText((await pg.getTextContent()).items));
      if(i===1){try{it.preview={kind:'img',src:(await pageToCanvas(pg,1.3)).toDataURL('image/jpeg',0.75)}}catch(e){}}
    }
    const note=pdf.numPages>n?` of ${pdf.numPages}`:'';
    if(pages.join('').replace(/\s/g,'').length>=20) return {pages,method:`PDF text layer (pdf.js, ${n}${note} page${n>1?'s':''})`,factor:1};
    setStep(it,'No text layer found — running OCR',48);
    const m=Math.min(pdf.numPages,OCR_PAGES);
    const srcs=[];for(let i=1;i<=m;i++)srcs.push(async()=>pageToCanvas(await pdf.getPage(i),2));
    const o=await ocrRun(it,srcs,50,40);
    return {pages:o.texts,method:`OCR on scanned PDF (Tesseract.js, ${m} page${m>1?'s':''}, confidence ${pct(o.factor)})`,factor:o.factor};
  }
  it.preview={kind:'img',src:URL.createObjectURL(it.file),obj:true};
  setStep(it,'Loading OCR engine',10);
  const o=await ocrRun(it,[it.file],20,70);
  return {pages:o.texts,method:`Image OCR (Tesseract.js, confidence ${pct(o.factor)})`,factor:o.factor};
}

/* ---------- queue ---------- */
function handleFiles(list){
  const files=Array.from(list||[]);let added=0;
  files.forEach(f=>{
    const ext=fileExt(f.name);
    if(!['pdf','png','jpg','jpeg'].includes(ext)||(f.type&&!/^(application\/pdf|image\/(png|jpe?g))$/.test(f.type))){toast(`"${f.name}" is not supported. Use PDF, PNG, JPG or JPEG.`,'error');return}
    if(f.size>MAX_BYTES){toast(`"${f.name}" is larger than 25 MB.`,'error');return}
    if(f.size===0){toast(`"${f.name}" is empty.`,'error');return}
    queue.push({id:uid(),name:f.name,size:f.size,file:f,status:'queued',progress:0,step:'Waiting'});added++;
  });
  if(added){toast(`${added} file${added>1?'s':''} added to the queue.`,'info');renderQueue();runQueue()}
}
function queueSample(kind){
  const s=SAMPLES[kind];if(!s)return;
  queue.push({id:uid(),name:s.file,size:new Blob([s.pages.join('')]).size,sample:kind,status:'queued',progress:0,step:'Waiting'});
  renderQueue();runQueue();
  if(curRoute!=='upload') go('upload');
}
async function runQueue(){
  if(busy)return;busy=true;
  try{for(;;){const it=queue.find(q=>q.status==='queued');if(!it)break;await processItem(it)}}
  finally{busy=false}
}
async function processItem(it){
  it.status='processing';setStep(it,'Reading file',4);
  const nap=ms=>it.sample?sleep(ms):Promise.resolve();
  try{
    let r;
    if(it.sample){await nap(450);setStep(it,'Extracting text (sample data)',25);await nap(450);r={pages:SAMPLES[it.sample].pages.slice(),method:'Demo sample text',factor:1}}
    else r=await extractReal(it);
    setStep(it,'Classifying document',62);await nap(350);
    setStep(it,'Extracting fields',78);await nap(350);
    setStep(it,'Validating and summarising',92);await nap(300);
    const d=buildDoc({filename:it.name,size:it.size,pages:r.pages,method:r.method,factor:r.factor,demo:!!it.sample});
    applyDup(d);d.summary=summarize(d.type,d.fields,d.pages,d.warnings);recalc(d);if(d.dupOf)logEdit(d,'Flagged as a possible duplicate');
    if(it.preview) runtime[d.id]=it.preview;
    docs.unshift(d);save();
    it.status='done';it.docId=d.id;setStep(it,'Complete',100);
    toast(`${it.name}: ${d.type}, ${pct(d.confidence)} confidence`+(d.status==='Needs review'?' — needs review':''),'success');
  }catch(err){
    console.error(err);
    it.status='error';it.error=err.message||String(err);
    const d=failedDoc(it,err);docs.unshift(d);save();it.docId=d.id;
    setStep(it,'Failed',100);
    toast(`Could not process ${it.name}: ${it.error}`,'error');
  }
  renderQueue();
  if(curRoute==='dashboard'||curRoute==='history') render(true);
}
function queueHTML(){
  if(!queue.length) return '<p class="muted">No files yet. Add documents above or try a sample.</p>';
  return '<ul class="qlist">'+queue.map(q=>{
    const cls=q.status==='done'?'s-ok':q.status==='error'?'s-err':q.status==='processing'?'s-p':'s-q';
    const lbl=q.status==='processing'?'<span class="spin"></span>Processing':q.status==='done'?'Done':q.status==='error'?'Failed':'Queued';
    return `<li class="qitem"><div class="qmain"><span class="fname">${esc(q.name)}${q.sample?' <span class="badge s-q">demo sample</span>':''}</span><span class="muted small">${fmtSize(q.size)} · ${esc(q.error?q.error:q.step)}</span><div class="bar" role="progressbar" aria-label="Progress for ${esc(q.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${q.progress}"><i style="width:${q.progress}%"></i></div>${pipeHTML(q)}</div><span class="badge ${cls}">${lbl}</span><div class="qact">${q.docId?`<button class="btn sm" data-act="open" data-id="${q.docId}">View</button>`:''}<button class="btn sm" data-act="rmq" data-id="${q.id}" ${q.status==='processing'?'disabled':''} aria-label="Remove ${esc(q.name)} from list">Remove</button></div></li>`;
  }).join('')+'</ul>';

const PSTEPS=['Read','Extract','Classify','Fields','Validate'];
function pipeHTML(q){
  const p=q.progress;

function batchDocs(){const ids=queue.filter(q=>q.status==='done'&&q.docId).map(q=>q.docId);return docs.filter(d=>ids.includes(d.id))}
function batchHTML(){

function warnHTML(d){
  const w=d.warnings;
  return `<h2>Missing or inconsistent information</h2>`+(w.length?`<ul class="warnlist">${w.map(x=>`<li class="${x.level}">${esc(x.msg)}</li>`).join('')}</ul>`:'<p class="okline">No missing or inconsistent information detected.</p>');
}
function sumHTML(d){
  return `<h2>Summary</h2><p>${d.summary?esc(d.summary):'<span class="muted">Not available.</span>'}</p><p class="muted small" style="margin-top:8px">Generated by a rule-based summariser from the extracted fields, not by an LLM.</p>`;
}
function confCell(f){return f.edited?'<span class="badge s-q">edited manually</span>':f.value?confBar(f.conf):'<span class="muted">—</span>'}
function rangesFor(d,n,txt){
  const sel=selField,out=[];
  d.fields.forEach((f,i)=>{
    if(!f.value||f.page!==n||f.hl==null||f.hs==null)return;
    if(!txt.slice(f.hs,f.hs+f.hl))return;
    if(!hlAll&&i!==sel)return;
    out.push({s:f.hs,e:f.hs+f.hl,i});
  });
  out.sort((a,b)=>a.s-b.s||((b.i===sel)-(a.i===sel)));
  const res=[];
  out.forEach(r=>{const l=res[res.length-1];if(!l||r.s>=l.e)res.push(r);else if(r.i===sel)res[res.length-1]=r});
  return res;
}
function pageHTML(txt,d,n){
  const rs=rangesFor(d,n,txt);let o='',p=0;
  rs.forEach((r,k)=>{const on=r.i===selField;o+=esc(txt.slice(p,r.s))+`<mark class="m c${r.i%6}${on?' sel':''}"${on?' id="hl"':''} style="animation-delay:${k*70}ms" title="${esc(d.fields[r.i].key)}">`+esc(txt.slice(r.s,r.e))+'</mark>';p=r.e});
  return o+esc(txt.slice(p));
}
function hlBarHTML(d){
  const chips=d.fields.map((f,i)=>({f,i})).filter(x=>x.f.value&&x.f.page&&x.f.hl!=null).map(({f,i})=>`<button type="button" class="chip c${i%6}${i===selField?' on':''}" data-act="src" data-i="${i}">${esc(f.key)}</button>`).join('');
  return `<label class="check"><input type="checkbox" data-chg="hlall" ${hlAll?'checked':''}><span>Highlight all extracted fields</span></label><div class="chips">${chips}</div>`;
}
function histHTML(d){
  const h=(d.history||[]).slice().reverse();
  return '<h2>Edit history</h2>'+(h.length?`<ol class="hist">${h.map(x=>`<li><time>${esc(fmtDate(x.t))}</time><span>${esc(x.msg)}</span></li>`).join('')}</ol>`:'<p class="muted">No history stored for this document.</p>');
}
function paneHTML(d){
  if(resTab==='preview'){
    const p=runtime[d.id];
    return p?`<img src="${p.src}" alt="Preview of ${esc(d.filename)}">`:'<p class="muted">No preview available. Previews are only kept in memory for files uploaded in this session; sample documents have no image.</p>';
  }
  if(!d.pages.length||!d.pages.join('').trim()) return '<p class="muted">No extracted text available for this document.</p>';
  return d.pages.map((t,i)=>`<div class="pgh">Page ${i+1}</div><pre>${pageHTML(t,d,i+1)}</pre>`).join('');
}

/* search */
function searchDocs(){
  const tokens=searchState.q.toLowerCase().split(/\s+/).filter(Boolean),out=[];
  docs.forEach(d=>{
    if(searchState.type!=='all'&&d.type!==searchState.type)return;
    if(!tokens.length){out.push({d,where:[],snip:''});return}
    const text=d.pages.join('\n');
    const hay={Filename:d.filename.toLowerCase(),Type:d.type.toLowerCase(),Fields:d.fields.map(f=>f.key+' '+f.value).join(' \n').toLowerCase(),Summary:(d.summary||'').toLowerCase(),Text:text.toLowerCase()};
    if(!tokens.every(t=>Object.values(hay).some(h=>h.includes(t))))return;
    const where=Object.keys(hay).filter(k=>tokens.some(t=>hay[k].includes(t)));
    let snip='';const flat=text.replace(/\s+/g,' '),fl=flat.toLowerCase(),t0=tokens.find(t=>fl.includes(t));
    if(t0){const i=fl.indexOf(t0);snip=(i>60?'…':'')+flat.slice(Math.max(0,i-60),i+110)+'…'}
    else{const f=d.fields.find(f=>tokens.some(t=>(f.key+' '+f.value).toLowerCase().includes(t)));if(f)snip=f.key+': '+f.value}
    out.push({d,where,snip});
  });
  return out;
}
function hlText(raw,tokens){
  const low=raw.toLowerCase(),r=[];
  tokens.forEach(t=>{let i=0;while((i=low.indexOf(t,i))>-1){r.push([i,i+t.length]);i+=t.length}});
  r.sort((a,b)=>a[0]-b[0]);
  const m=[];r.forEach(x=>{const l=m[m.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else m.push([x[0],x[1]])});
  let out='',p=0;m.forEach(([s,e])=>{out+=esc(raw.slice(p,s))+'<mark>'+esc(raw.slice(s,e))+'</mark>';p=e});
  return out+esc(raw.slice(p));
}
function searchHTML(){
  const res=searchDocs(),tokens=searchState.q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!docs.length) return emptyState('Nothing to search','Upload a document first.','<a class="btn primary" href="#/upload">Upload</a>');
  if(!res.length) return emptyState('No matches','Try a different keyword, field value or document type.','');
  return `<p class="muted small" style="margin-top:14px">${res.length} document${res.length>1?'s':''} found${tokens.length?'':' (showing all)'}</p>`+res.map(({d,where,snip})=>`<a class="res" href="#/results/${d.id}"><div class="top"><span class="fname">${hlText(d.filename,tokens)}</span>${typeBadge(d.type)}${statusBadge(d.status)}${where.map(w=>`<span class="badge s-q">in ${w.toLowerCase()}</span>`).join('')}</div>${snip?`<p>${hlText(snip,tokens)}</p>`:''}</a>`).join('');
}
function vSearch(){
  return `<div class="pagehead"><div><h1 tabindex="-1">Search</h1><p class="muted">Search by filename, document type, extracted fields or keywords.</p></div></div>
<div class="card"><div class="searchbar"><label class="sr" for="sq">Search query</label><input id="sq" type="search" value="${esc(searchState.q)}" placeholder="e.g. invoice, Northwind, INV-2026, certificate…" autocomplete="off"><label class="sr" for="stype">Filter by type</label><select id="stype" data-chg="stype"><option value="all">All types</option>${TYPES.map(t=>`<option ${searchState.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div id="sres" aria-live="polite">${searchHTML()}</div>`;
}

/* history */
function vHistory(){
  const rows=docs.map(d=>`<tr><td class="fname">${esc(d.filename)}${d.demo?' <span class="badge s-q">demo</span>':''}${(d.warnings||[]).some(w=>w.dup)?' <span class="badge s-warn">duplicate?</span>':''}</td><td>${typeBadge(d.type)}</td><td class="muted">${fmtDate(d.uploaded)}</td><td>${statusBadge(d.status)}</td><td>${d.status==='Failed'?'—':confBar(d.confidence)}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="open" data-id="${d.id}">View</button><button class="btn sm danger" data-act="del" data-id="${d.id}" aria-label="Delete ${esc(d.filename)}">Delete</button></div></td></tr>`).join('');
  return `<div class="pagehead"><div><h1 tabindex="-1">Document history</h1><p class="muted">${docs.length} document${docs.length===1?'':'s'} stored in this browser.</p></div><div class="row"><button class="btn" data-act="expAllJSON" ${docs.length?'':'disabled'}>Export all (JSON)</button><button class="btn" data-act="expAllCSV" ${docs.length?'':'disabled'}>Export all (CSV)</button><button class="btn" data-act="expAllXLS" ${docs.length?'':'disabled'}>Export all (Excel CSV)</button><button class="btn danger" data-act="clearAll" ${docs.length?'':'disabled'}>Clear all</button></div></div>`+

}

/* ---------- exports ---------- */
function download(name,mime,content){
  const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type:mime}));
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
}
const baseName=d=>d.filename.replace(/\.[^.]+$/,'').replace(/[^\w\-]+/g,'_').slice(0,50)||'document';
function exportObj(d){
  return {document:{filename:d.filename,type:d.type,classificationConfidence:d.typeConfidence,uploaded:d.uploaded,status:d.status,overallConfidence:d.confidence,extractionMethod:d.method,demoSample:!!d.demo,pages:d.pageCount||d.pages.length},
  fields:d.fields.map(f=>({field:f.key,value:f.value,confidence:f.conf,page:f.page,source:f.snippet,verified:f.verified,editedManually:f.edited,required:f.required})),
  warnings:d.warnings.map(w=>({level:w.level,message:w.msg})),summary:d.summary,history:(d.history||[]).map(h=>({time:h.t,event:h.msg})),
  notes:'Generated by rule-based heuristics in the browser. No LLM or backend was used.'};
}
function csvCell(v){let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csvOf(list){
  const out=[['Document','Type','Field','Value','Confidence','Page','Source','Verified'].map(csvCell).join(',')];
  list.forEach(d=>d.fields.forEach(f=>out.push([d.filename,d.type,f.key,f.value,f.conf,f.page==null?'':f.page,f.snippet,f.verified?'yes':'no'].map(csvCell).join(','))));
  return out.join('\r\n');
}
function txtOf(d){
  return `Document: ${d.filename}\nType: ${d.type}\nStatus: ${d.status}\nOverall confidence: ${pct(d.confidence)}\n\nSUMMARY\n${d.summary||'(not available)'}\n\nFLAGS\n${d.warnings.length?d.warnings.map(w=>'- ['+w.level+'] '+w.msg).join('\n'):'- None'}\n\nGenerated by rule-based heuristics in the browser (no LLM).\n`;
}
function wideCsv(list){
  const keys=[];list.forEach(d=>d.fields.forEach(f=>{if(!keys.includes(f.key))keys.push(f.key)}));
  const out=[['Document','Type','Status','Confidence','Uploaded'].concat(keys,['Issues','Summary']).map(csvCell).join(',')];
  list.forEach(d=>{
    const row=[d.filename,d.type,d.status,pct(d.confidence),d.uploaded].concat(keys.map(k=>{const f=d.fields.find(x=>x.key===k);return f?f.value:''}),[d.warnings.filter(w=>w.level==='warn'||w.level==='error').length,d.summary]);
    out.push(row.map(csvCell).join(','));
  });
  return out.join('\r\n');
}
function reportHTML(d){
  const rows=d.fields.map(f=>`<tr><td>${esc(f.key)}${f.required?' *':''}</td><td>${esc(f.value||'\u2014')}</td><td>${f.value?pct(f.conf):'\u2014'}</td><td>${f.page?'p.'+f.page:'\u2014'}</td><td>${f.verified?'\u2714':''}</td></tr>`).join('');
  const w=d.warnings.map(x=>`<li class="${esc(x.level)}">${esc(x.msg)}</li>`).join('')||'<li class="ok">No missing or inconsistent information detected.</li>';
  const h=(d.history||[]).slice().reverse().map(x=>`<li><b>${esc(fmtDate(x.t))}</b> \u2014 ${esc(x.msg)}</li>`).join('');
  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(baseName(d))} - extraction report</title><style>
@page{margin:16mm}*{box-sizing:border-box}body{font:13px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#18322d;margin:0}
h1{font:600 26px Georgia,serif;margin:0 0 4px;color:#0a1c19}h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#2f7f74;margin:22px 0 8px;border-bottom:2px solid #a9c19a;padding-bottom:4px}
.sub{color:#5d7a72;margin:0 0 14px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.meta div{border:1px solid #cfdccf;border-radius:6px;padding:8px 10px;background:#f3f8f1}.meta span{display:block;font-size:11px;color:#5d7a72}.meta b{font-size:15px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #dbe6dc;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#2f7f74;background:#f3f8f1}
ul,ol{margin:0;padding-left:18px}li.warn{color:#8a5a00}li.error{color:#a3322a}li.info{color:#2c6b7a}li.ok{color:#2f7f50}.foot{margin-top:24px;font-size:11px;color:#6d857d;border-top:1px solid #dbe6dc;padding-top:8px}
</style></head><body><h1>Extraction report</h1><p class="sub">${esc(d.filename)} \u00b7 generated ${esc(fmtDate(new Date().toISOString()))}</p>
<div class="meta"><div><span>Type</span><b>${esc(d.type)}</b></div><div><span>Status</span><b>${esc(d.status)}</b></div><div><span>Confidence</span><b>${pct(d.confidence)}</b></div><div><span>Pages</span><b>${d.pageCount||d.pages.length}</b></div></div>
<h2>Summary</h2><p>${esc(d.summary||'Not available.')}</p>
<h2>Flags</h2><ul>${w}</ul>
<h2>Extracted fields</h2><table><thead><tr><th>Field</th><th>Value</th><th>Confidence</th><th>Source</th><th>Verified</th></tr></thead><tbody>${rows}</tbody></table>
${h?`<h2>Edit history</h2><ul>${h}</ul>`:''}
<p class="foot">Generated by Arixa Lens (Team Arixa). Rule-based extraction in the browser, no LLM. Extraction method: ${esc(d.method)}. Please review values before relying on them.</p></body></html>`;
}
function printReport(d){
  const f=document.createElement('iframe');f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const w=f.contentWindow,doc=w.document;doc.open();doc.write(reportHTML(d));doc.close();
  setTimeout(()=>{try{w.focus();w.print()}catch(e){toast('Printing is blocked in this browser.','error')}setTimeout(()=>f.remove(),4000)},350);
}
function exportDoc(kind){
  const d=curDoc();if(!d)return;
  if(d.stripped){toast('Values for this document were not stored. Re-upload it to export.','error');return}
  if(kind==='json')download(baseName(d)+'-results.json','application/json',JSON.stringify(exportObj(d),null,2));
  else if(kind==='csv')download(baseName(d)+'-fields.csv','text/csv;charset=utf-8','\ufeff'+csvOf([d]));
  else if(kind==='xls')download(baseName(d)+'-excel.csv','text/csv;charset=utf-8','\ufeff'+wideCsv([d]));
  else if(kind==='pdf'){printReport(d);toast('In the print dialog, choose "Save as PDF".','info');return}
  else download(baseName(d)+'-summary.txt','text/plain;charset=utf-8',txtOf(d));
  toast('Export downloaded.','success');
}
function exportAll(kind){
  const list=docs.filter(d=>!d.stripped);
  if(!list.length){toast('No documents with stored values to export.','error');return}
  if(kind==='json')download('arixa-lens-all-results.json','application/json',JSON.stringify({exportedAt:new Date().toISOString(),documents:list.map(exportObj)},null,2));
  else if(kind==='xls')download('arixa-lens-all-excel.csv','text/csv;charset=utf-8','\ufeff'+wideCsv(list));
  else download('arixa-lens-all-fields.csv','text/csv;charset=utf-8','\ufeff'+csvOf(list));
  toast(`Exported ${list.length} document${list.length>1?'s':''}${list.length<docs.length?' (documents without stored values were skipped)':''}.`,'success');
}

/* ---------- actions ---------- */
function removeDoc(id){
  const r=runtime[id];if(r&&r.obj){try{URL.revokeObjectURL(r.src)}catch(e){}}
  delete runtime[id];docs=docs.filter(d=>d.id!==id);
  if(lastViewed===id)lastViewed=null;
}
function askConfirm(msg){
  return new Promise(res=>{
    const o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:300;padding:16px';
    o.innerHTML='<div role="alertdialog" aria-modal="true" aria-label="Confirm" style="background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;max-width:420px;width:100%"><p style="margin-bottom:18px">'+esc(msg)+'</p><div class="row" style="justify-content:flex-end"><button class="btn" data-v="0">Cancel</button><button class="btn danger" data-v="1">Delete</button></div></div>';
    const done=v=>{o.remove();document.removeEventListener('keydown',kd);res(v)};
    const kd=e=>{if(e.key==='Escape')done(false)};
    o.addEventListener('click',e=>{const b=e.target.closest('button');if(b)done(b.dataset.v==='1');else if(e.target===o)done(false)});
    document.addEventListener('keydown',kd);document.body.appendChild(o);
    const b=o.querySelector('button');if(b)b.focus();
  });
}
const ACT={
  quick(){if(curRoute!=='upload')go('upload');$('#fileInput').click()},
  browse(t,e){if(e&&e.stopPropagation)e.stopPropagation();$('#fileInput').click()},
  sample(t){queueSample(t.dataset.kind)},
  rmq(t){queue=queue.filter(q=>q.id!==t.dataset.id||q.status==='processing');renderQueue()},
  clearq(){queue=queue.filter(q=>q.status==='queued'||q.status==='processing');renderQueue()},
  open(t){go('results/'+t.dataset.id)},
  async del(t){
    const d=docs.find(x=>x.id===t.dataset.id);if(!d)return;
    if(!(await askConfirm('Delete "'+d.filename+'" from history? This cannot be undone.')))return;
    removeDoc(d.id);save();render(true);toast('Document deleted.','success');
  },
  async clearAll(){
    if(!docs.length)return;
    if(!(await askConfirm('Delete all '+docs.length+' documents from this browser? This cannot be undone.')))return;
    Object.keys(runtime).forEach(k=>{const r=runtime[k];if(r&&r.obj){try{URL.revokeObjectURL(r.src)}catch(e){}}delete runtime[k]});
    docs=[];lastViewed=null;save();render(true);toast('All documents deleted.','success');
  },
  loadDemo(){addDemoDocs();save();render(true);toast('Demo documents added.','success')},
  tab(t){resTab=t.dataset.tab;const hb=$('#hlbar');if(hb)hb.hidden=resTab!=='text';$$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===resTab)));const d=curDoc();if(d)$('#pane').innerHTML=paneHTML(d)},
  src(t){selField=+t.dataset.i;resTab='text';$$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab==='text')));const d=curDoc();if(d){const hb=$('#hlbar');if(hb){hb.hidden=false;hb.innerHTML=hlBarHTML(d)}$('#pane').innerHTML=paneHTML(d);const h=$('#hl');if(h)h.scrollIntoView({block:'center',behavior:'smooth'})}},
  verifyAll(){
    const d=curDoc();if(!d)return;
    let n=0;d.fields.forEach(f=>{if(f.value&&!f.verified){f.verified=true;n++}});
    if(n)logEdit(d,`Verified all fields (${n})`);recalc(d);save();render(true);toast(n?`${n} field${n>1?'s':''} verified.`:'All fields were already verified.','success');
  },
  expJSON(){exportDoc('json')},expCSV(){exportDoc('csv')},expTXT(){exportDoc('txt')},expXLS(){exportDoc('xls')},expPDF(){exportDoc('pdf')},
  expAllJSON(){exportAll('json')},expAllCSV(){exportAll('csv')},expAllXLS(){exportAll('xls')},
  expBatchXLS(){const l=batchDocs().filter(d=>!d.stripped);if(!l.length)return;download('arixa-lens-batch-excel.csv','text/csv;charset=utf-8','\ufeff'+wideCsv(l));toast('Batch exported.','success')},
  expBatchJSON(){const l=batchDocs().filter(d=>!d.stripped);if(!l.length)return;download('arixa-lens-batch.json','application/json',JSON.stringify({exportedAt:new Date().toISOString(),documents:l.map(exportObj)},null,2));toast('Batch exported.','success')}
};
const view=$('#view');
view.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||!view.contains(t))return;const fn=ACT[t.dataset.act];if(fn)fn(t,e)});
view.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.chg;if(!k)return;
  if(k==='doc'){go('results/'+t.value);return}
  if(k==='stype'){searchState.type=t.value;$('#sres').innerHTML=searchHTML();return}
  if(k==='persist'){settings.persistValues=t.checked;lsSet(LS_SET,JSON.stringify(settings));save();toast(t.checked?'Extracted values will now be saved in this browser.':'Extracted values will no longer be saved.','info');return}
  if(k==='theme'){setTheme(t.value);toast('Theme: '+(t.value==='system'?'match my device':t.value)+'.','info');return}
  if(k==='ocr'){settings.ocrLang=t.value;lsSet(LS_SET,JSON.stringify(settings));toast(t.value==='eng'?'OCR language: English.':'OCR language: English + Hindi.','info');return}
  if(k==='hlall'){hlAll=t.checked;const dd=curDoc();if(dd){$('#pane').innerHTML=paneHTML(dd)}return}
  const d=curDoc();if(!d)return;
  if(k==='type'){
    const was=d.type,a=analyze(d.pages,d.factor||1,t.value);
    Object.assign(d,a);applyDup(d);d.summary=summarize(d.type,d.fields,d.pages,d.warnings);logEdit(d,`Reclassified ${was} → ${t.value}`);selField=null;recalc(d);save();render(true);toast('Reclassified as '+t.value+'.','success');return;
  }
  const i=+t.dataset.i,f=d.fields[i];if(!f)return;
  if(k==='field'){
    const v=t.value.trim();if(v===f.value)return;
    logEdit(d,`${f.key}: "${f.value||'(empty)'}" → "${v||'(empty)'}"`);
    f.value=v;f.edited=true;f.verified=!!v;
    d.warnings=validate(d.type,d.fields,d.pages);applyDup(d);d.summary=summarize(d.type,d.fields,d.pages,d.warnings);
    recalc(d);save();
    const row=t.closest('tr');
    if(row){row.querySelector('.cc-w').innerHTML=confCell(f);const cb=row.querySelector('input[type=checkbox]');cb.checked=f.verified;cb.disabled=!v}
    refreshDerived(d);toast(f.key+' updated.','success');
  } else if(k==='verify'){
    f.verified=t.checked;logEdit(d,`${f.key} ${t.checked?'marked verified':'unmarked'}`);recalc(d);save();refreshDerived(d);
  }
});
view.addEventListener('input',e=>{if(e.target.id==='sq'){searchState.q=e.target.value;$('#sres').innerHTML=searchHTML()}});
view.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.id==='drop'){e.preventDefault();$('#fileInput').click()}});
view.addEventListener('click',e=>{if(e.target.closest('#drop')&&!e.target.closest('[data-act]'))$('#fileInput').click()});
['dragenter','dragover'].forEach(n=>view.addEventListener(n,e=>{const z=e.target.closest('#drop');if(z){e.preventDefault();z.classList.add('over')}}));
view.addEventListener('dragleave',e=>{const z=e.target.closest('#drop');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
view.addEventListener('drop',e=>{const z=e.target.closest('#drop');if(z){e.preventDefault();z.classList.remove('over');handleFiles(e.dataTransfer&&e.dataTransfer.files)}});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());
$('#fileInput').addEventListener('change',e=>{handleFiles(e.target.files);e.target.value=''});

/* ---------- navigation & routing ---------- */
const NAV=[
 ['dashboard','Dashboard','<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>'],
 ['upload','Upload','<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>'],
 ['results','Results','<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>'],
 ['search','Search','<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'],
 ['history','History','<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>'],
 ['settings','About & settings','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>']
];
$('#nav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" data-route="${n[0]}"><svg viewBox="0 0 24 24" aria-hidden="true">${n[2]}</svg>${esc(n[1])}</a>`).join('');
const VIEWS={dashboard:vDashboard,upload:vUpload,results:vResults,search:vSearch,history:vHistory,settings:vSettings};
const TITLES={dashboard:'Dashboard',upload:'Upload',results:'Results',search:'Search',history:'History',settings:'About & settings'};
let navState={r:'dashboard',id:null},ignoreHash=false;
function setNav(path){const p=String(path||'').replace(/^#?\/?/,'').split('/');navState={r:VIEWS[p[0]]?p[0]:'dashboard',id:p[1]||null}}
function parseHash(){return navState}
function go(path){
  setNav(path);
  try{const h='#/'+navState.r+(navState.id?'/'+navState.id:'');if(location.hash!==h){ignoreHash=true;location.hash=h;setTimeout(()=>{ignoreHash=false},80)}}catch(e){}
  render(false);
}
function animateCounts(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  $$('[data-count]').forEach(el=>{
    const to=+el.dataset.count,suf=el.dataset.suffix||'',t0=performance.now(),dur=900;
    const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+suf;if(p<1)requestAnimationFrame(step)};
    el.textContent='0'+suf;requestAnimationFrame(step);
  });
}
function closeNav(){document.body.classList.remove('nav-open');$('#menuBtn').setAttribute('aria-expanded','false')}
function render(keep){
  const {r,id}=parseHash();curRoute=r;
  $$('#nav a').forEach(a=>{const on=a.dataset.route===r;a.classList.toggle('active',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const y=window.scrollY;
  try{view.innerHTML=VIEWS[r](id)}catch(err){console.error(err);view.innerHTML='<div class="card empty"><h2>Something went wrong</h2><p>'+esc(err.message)+'</p></div>'}
  const h1=view.querySelector('h1');if(h1&&!h1.querySelector('.hl-fx'))h1.innerHTML='<span class="hl-fx">'+h1.innerHTML+'</span>';
  if(!keep){view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter');clearTimeout(enterT);enterT=setTimeout(()=>view.classList.remove('enter'),1500);animateCounts()}
  document.title=TITLES[r]+' · Arixa Lens';
  if(keep) window.scrollTo(0,y); else {window.scrollTo(0,0);view.focus({preventScroll:true})}
  if(r==='results'&&selField!=null){const h=$('#hl');if(h)h.scrollIntoView({block:'center'})}
  closeNav();
}
window.addEventListener('hashchange',()=>{if(ignoreHash){ignoreHash=false;return}setNav(location.hash);render(false)});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#/"]');if(!a)return;e.preventDefault();go(a.getAttribute('href'))});
$('#menuBtn').addEventListener('click',()=>{const o=document.body.classList.toggle('nav-open');$('#menuBtn').setAttribute('aria-expanded',String(o))});
$('#scrim').addEventListener('click',closeNav);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});
$('#gsearch').addEventListener('submit',e=>{
  e.preventDefault();searchState.q=$('#gq').value;
  go('search');
});

/* ---------- theme (dark / light / system) ---------- */
const LS_THEME='docintel.theme.v1';
let themePref=(()=>{const t=lsGet(LS_THEME);return t==='light'||t==='dark'||t==='system'?t:'dark'})();
const sysLight=window.matchMedia?window.matchMedia('(prefers-color-scheme: light)'):null;
const themeNow=()=>themePref==='system'?(sysLight&&sysLight.matches?'light':'dark'):themePref;
function applyTheme(){
  const m=themeNow(),light=m==='light';
  document.documentElement.setAttribute('data-theme',m);
  const b=$('#themeBtn');if(b){const l=light?'Switch to dark theme':'Switch to light theme';b.setAttribute('aria-label',l);b.title=l}
  const mc=document.querySelector('meta[name=theme-color]');if(mc)mc.setAttribute('content',light?'#f2f6ee':'#0a1c19');
}
function setTheme(p){themePref=p;lsSet(LS_THEME,p);applyTheme()}
if(sysLight){const h=()=>{if(themePref==='system')applyTheme()};if(sysLight.addEventListener)sysLight.addEventListener('change',h);else if(sysLight.addListener)sysLight.addListener(h)}
$('#themeBtn').addEventListener('click',()=>{setTheme(themeNow()==='light'?'dark':'light');if(curRoute==='settings')render(true)});
applyTheme();

/* ---------- init ---------- */
(function init(){
  const raw=lsGet(LS_KEY);
  if(raw===null){addDemoDocs();save()}
  else{
    try{docs=JSON.parse(raw)}catch(e){docs=[]}
    if(!Array.isArray(docs))docs=[];
    docs=docs.filter(d=>d&&typeof d==='object'&&d.id).map(d=>Object.assign({pages:[],fields:[],warnings:[],history:[],summary:'',method:'—',pageCount:0,size:0,filename:'(unnamed)',type:'Other',status:'Needs review',confidence:0,typeConfidence:0,uploaded:new Date().toISOString()},d));
  }
  setNav(location.hash);render(false);
})();

/* ---------- opening animation ---------- */
(function intro(){
  const el=$('#intro');if(!el)return;
  const gate=$('#introGate'),stage=$('#introStage'),svg=$('#introSvg'),cap=$('#introCap'),word=$('#introWord');
  const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const LOGOS=[
    {cap:'Capture',col:'var(--sage)',svg:'<circle cx="60" cy="60" r="36" pathLength="1"/><circle class="fill" cx="60" cy="60" r="5"/>'},
    {cap:'Extract',col:'var(--teal)',svg:'<path d="M60 20 L95 40 V80 L60 100 L25 80 V40 Z" pathLength="1"/><path class="acc" d="M60 20 V100" pathLength="1"/>'},
    {cap:'Understand',col:'var(--mint)',svg:'<rect x="30" y="30" width="46" height="46" pathLength="1"/><rect class="acc" x="46" y="46" width="46" height="46" pathLength="1"/>'},
    {cap:'Verify',col:'var(--olive)',svg:'<path d="M60 22 L98 94 H22 Z" pathLength="1"/><path class="acc" d="M46 68 L57 79 L76 56" pathLength="1"/>'}
  ];
  const FINAL='<path d="M28 96 L60 24 L92 96" pathLength="1"/><path class="acc" d="M44 74 H76" pathLength="1"/>';
  let skipped=false,ended=false;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  function onKey(e){if(e.key==='Escape')skip()}
  function finish(){
    if(ended)return;ended=true;
    el.classList.add('done');document.body.classList.remove('intro-active');
    document.removeEventListener('keydown',onKey);
    setTimeout(()=>{try{el.remove()}catch(e){}},650);
    try{view.focus({preventScroll:true})}catch(e){}
  }
  function skip(){skipped=true;finish()}
  function draw(markup,label,col){
    svg.style.setProperty('--ac',col||'var(--sage)');svg.classList.remove('draw','out');svg.innerHTML=markup;cap.textContent=label||'';
    void svg.getBoundingClientRect();
    if(!reduced)svg.classList.add('draw');
  }
  async function play(){
    gate.hidden=true;stage.hidden=false;
    if(!reduced){
      for(const l of LOGOS){
        if(skipped)return;draw(l.svg,l.cap,l.col);await wait(820);
        if(skipped)return;svg.classList.add('out');await wait(230);
      }
    }
    if(skipped)return;
    draw(FINAL,'');
    word.innerHTML='ARIXA'.split('').map((c,i)=>'<span style="animation-delay:'+(reduced?0:(0.55+i*0.09))+'s">'+c+'</span>').join('');
    await wait(reduced?100:450);
    if(skipped)return;
    await wait(reduced?1500:2300);
    finish();
  }
  $('#introSkip').addEventListener('click',skip);
  document.addEventListener('keydown',onKey);
  try{$('#introSkip').focus()}catch(e){}
  setTimeout(()=>{if(!skipped&&!ended)play()},reduced?400:1600);
})();
})();
